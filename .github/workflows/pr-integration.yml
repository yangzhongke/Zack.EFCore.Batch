name: pr-integration-tests

on:
  pull_request:

jobs:
  fallback-tests:
    name: fallback-tests (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net8.0
            dotnet: 8.0.x
          - tfm: net10.0
            dotnet: 10.0.x

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Run fallback and routing tests
        run: dotnet test Tests/Zack.EFCore.Batch.Tests/Zack.EFCore.Batch.Tests.csproj --configuration Release --framework ${{ matrix.tfm }} --nologo

  sqlserver-integration:
    name: sqlserver-integration (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net8.0
            dotnet: 8.0.x
          - tfm: net10.0
            dotnet: 10.0.x
    env:
      SA_PASSWORD: Your_strong_password123!
      TEST_DB_SQLSERVER_CS: Server=127.0.0.1,1433;Database=efcorebatch_test;User Id=sa;Password=Your_strong_password123!;TrustServerCertificate=True

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Your_strong_password123!
        ports:
          - 1433:1433
        options: --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S . -U sa -P Your_strong_password123! -Q 'SELECT 1' -C" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Wait for SQL Server and create database
        run: |
          for i in {1..60}; do
            if docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" -C >/dev/null 2>&1; then
              echo "SQL Server is ready"
              break
            fi
            echo "Waiting for SQL Server... ($i/60)"
            sleep 2
          done
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q "IF DB_ID('efcorebatch_test') IS NULL CREATE DATABASE efcorebatch_test;" -C
      - name: Run SQL Server integration tests
        run: dotnet test Tests/Zack.EFCore.Batch.IntegrationTests.SqlServer/Zack.EFCore.Batch.IntegrationTests.SqlServer.csproj --configuration Release --framework ${{ matrix.tfm }} --nologo

  mysql-integration:
    name: mysql-integration (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net8.0
            dotnet: 8.0.x
          - tfm: net9.0
            dotnet: 9.0.x
    env:
      TEST_DB_MYSQL_CS: Server=127.0.0.1;Port=3306;Database=efcorebatch_test;User=root;Password=root;AllowLoadLocalInfile=true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: efcorebatch_test
          MYSQL_ROOT_HOST: '%'
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval 10s --health-timeout 5s --health-retries 3
        ports:
          - 3306:3306
        command: --local-infile=1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if docker exec ${{ job.services.mysql.id }} mysqladmin ping -h localhost -uroot -proot --silent; then
              break
            fi
            sleep 2
          done
          docker exec ${{ job.services.mysql.id }} mysql -h localhost -uroot -proot -e "SET GLOBAL local_infile = 1;"
          docker exec ${{ job.services.mysql.id }} mysql -h localhost -uroot -proot -e "SHOW GLOBAL VARIABLES LIKE 'local_infile';"
      - name: Run MySQL integration tests
        run: dotnet test Tests/Zack.EFCore.Batch.IntegrationTests.MySQL/Zack.EFCore.Batch.IntegrationTests.MySQL.csproj --configuration Release --framework ${{ matrix.tfm }} --nologo

  npgsql-integration:
    name: npgsql-integration (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net8.0
            dotnet: 8.0.x
          - tfm: net10.0
            dotnet: 10.0.x
    env:
      TEST_DB_PG_CS: Host=127.0.0.1;Port=5432;Database=efcorebatch_test;Username=postgres;Password=postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: efcorebatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
      - name: Run PostgreSQL integration tests
        run: dotnet test Tests/Zack.EFCore.Batch.IntegrationTests.Npgsql/Zack.EFCore.Batch.IntegrationTests.Npgsql.csproj --configuration Release --framework ${{ matrix.tfm }} --nologo

  oracle-integration:
    name: oracle-integration (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net8.0
            dotnet: 8.0.x
          - tfm: net10.0
            dotnet: 10.0.x
    env:
      TEST_DB_ORACLE_CS: User Id=app;Password=app_password;Data Source=127.0.0.1:1521/FREEPDB1

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: oracle_password
          APP_USER: app
          APP_USER_PASSWORD: app_password
        ports:
          - 1521:1521

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Run Oracle integration tests
        run: |
          for i in {1..3}; do
            dotnet test Tests/Zack.EFCore.Batch.IntegrationTests.Oracle/Zack.EFCore.Batch.IntegrationTests.Oracle.csproj --configuration Release --framework ${{ matrix.tfm }} --nologo && exit 0
            echo "Oracle tests failed on attempt $i/3"
            if [ "$i" -lt 3 ]; then
              echo "Retrying in 20 seconds..."
              sleep 20
            fi
          done
          exit 1

